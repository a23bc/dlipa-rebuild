name: DLiPA
options:
  bundleIdPrefix: com.ahmedbafkir
  # Localizations carried over from the original DLiPA 1.4.
  knownRegions: ['ar', 'de', 'en', 'es', 'fr', 'hi', 'id', 'it', 'ja', 'ko', 'ru', 'tr', 'vi', 'zh-Hans']
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  DLiPA:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    supportedDestinations: [iOS]
    sources:
      - path: DLiPA
        excludes:
          - "**/*.md"
      # App icon and any bundled resources.
      - path: DLiPA/Assets.xcassets
      # The four Apple binaries are staged here by scripts/stage-assets.sh
      # and copied into the app bundle.
      - path: DLiPA/Resources
        type: folder
    dependencies:
      - framework: Frameworks/SapBridge.xcframework
        embed: true
        codeSignOnCopy: false
        removeHeaders: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedbafkir.dlipa
        PRODUCT_NAME: DLiPA
        INFOPLIST_FILE: DLiPA/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        # Exposes the gomobile-generated ObjC API to Swift. Without this the
        # Sapbridge types are unresolvable and the build fails.
        SWIFT_OBJC_BRIDGING_HEADER: DLiPA/DLiPA-Bridging-Header.h
        # Headers the framework installs; keep them so the import resolves.
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES

        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_BITCODE: NO
        # Unsigned build: the user signs the IPA with their own Apple ID
        # via AltStore / Sideloadly, so no team or provisioning profile is
        # needed at build time.
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Local networking + arbitrary loads for the embedded HTTP server
        # that serves the itms-services install manifest.
        NSAppTransportSecurity: ""
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"

name: Build iOS IPA

# Builds an UNSIGNED .app and packages it as an .ipa.
# No Apple Developer account is needed: the user signs the IPA on their own
# machine with AltStore / Sideloadly using their free Apple ID, exactly as the
# original DLiPA README instructs.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        required: false
        default: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-bridge:
    name: Build SAP bridge for iOS
    runs-on: macos-15
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install build tools
        run: |
          brew install ldid cmake pkg-config

      - name: Stage the Apple SAP assets
        run: |
          git lfs install
          git lfs pull
          sh scripts/stage-assets.sh "$GITHUB_WORKSPACE/VendorAssets" "$GITHUB_WORKSPACE/build/sap-assets"

      - name: Run Go unit tests
        working-directory: sapbridge
        env:
          # Lets the live handshake/kbsync tests run instead of skipping.
          DSH_SAP_ASSET_DIR: ${{ github.workspace }}/build/sap-assets
        run: |
          go test -count=1 ./...

      - name: Build Unicorn for iOS arm64
        run: |
          sh scripts/build-unicorn-ios.sh

      # gomobile is a host (macOS) tool. It must NOT see the iOS CGO_LDFLAGS,
      # or the linker rejects the Unicorn archive as the wrong platform.
      - name: Install gomobile
        # gomobile is a host tool. It must NOT inherit GOOS=ios, or go install
        # cross-compiles it and drops it in $GOPATH/bin/ios_arm64/gomobile.
        # It must also not see the iOS CGO_LDFLAGS, or the linker rejects the
        # Unicorn archive as the wrong platform.
        working-directory: sapbridge
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # init builds gobind, which bind requires. It must run without
          # GOOS=ios so gobind is a host binary too.
          gomobile init
          echo "==> gomobile ready"

      - name: Bind the bridge into an iOS framework
        working-directory: sapbridge
        env:
          CGO_ENABLED: "1"
          GOOS: ios
          GOARCH: arm64
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          # Unicorn must be force-loaded into the framework and its symbols
          # exported so purego.Dlsym can find them at runtime.
          #
          # Recorded with go env -w rather than only the shell environment:
          # gomobile spawns its own go build, and a value that exists only in
          # the environment is easy to lose across that boundary.
          go env -w CGO_LDFLAGS="-Wl,-force_load,${{ github.workspace }}/build/ios/libunicorn.a -Wl,-export_dynamic"
          echo "==> CGO_LDFLAGS: $(go env CGO_LDFLAGS)"
          # Only the device slice. Simulator targets cannot link an arm64 iOS
          # archive, and gomobile builds every variant of the target.
          gomobile bind -target=ios/arm64 \
            -o ../app/DLiPA/Frameworks/SapBridge.xcframework .
          echo "==> framework contents"
          ls -laR ../app/DLiPA/Frameworks/ | head -40
      - name: Inspect the framework
        run: |
          # An xcframework nests the real binary under ios-arm64/.
          find app/DLiPA/Frameworks/SapBridge.xcframework -type f | head -20
          FRAMEWORK=$(find app/DLiPA/Frameworks/SapBridge.xcframework -name SapBridge -type f | head -n 1)
          echo "==> binary: $FRAMEWORK"
          ls -la "$FRAMEWORK"
          file "$FRAMEWORK"
          echo "==> does it contain any uc_ symbol?"
          nm -A "$FRAMEWORK" 2>/dev/null | grep -c uc_ || echo 0
          echo "==> does it contain purego?"
          nm -A "$FRAMEWORK" 2>/dev/null | grep -c purego || echo 0

      - name: Verify the framework contains Unicorn
        run: |
          # A missing Unicorn backend only shows up as uc_open failing at
          # runtime, which is invisible until the app runs. Check here.
          FRAMEWORK=$(find app/DLiPA/Frameworks/SapBridge.xcframework -name SapBridge -type f | head -n 1)
          if [ -z "$FRAMEWORK" ]; then echo "::error::SapBridge binary not found in the xcframework"; exit 1; fi
          if nm -A "$FRAMEWORK" 2>/dev/null | grep -q uc_open; then
            echo "==> Unicorn symbols present"
          else
            echo "::error::uc_open not found; Unicorn is not linked into the framework"
            exit 1
          fi
          echo "==> exported uc_ symbols:"
          nm -A "$FRAMEWORK" 2>/dev/null | grep -c " T uc_" || true

      - name: Pack the framework for the app job
        id: pack
        run: |
          # Include libunicorn.a: the app link re-links the framework objects,
          # so OTHER_LDFLAGS in project.yml needs the same archive.
          tar -czf sapbridge-ios.tar.gz \
            -C app/DLiPA/Frameworks SapBridge.xcframework \
            -C "${{ github.workspace }}/build/ios" --transform "s,^,ios/," libunicorn.a
          echo "artifact=sapbridge-ios.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sapbridge-ios
          path: sapbridge-ios.tar.gz
          retention-days: 5

  app:
    name: Build unsigned DLiPA app
    runs-on: macos-15
    needs: go-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Download the SAP bridge
        uses: actions/download-artifact@v4
        with:
          name: sapbridge-ios
          path: app/DLiPA/Frameworks

      - name: Unpack the framework
        run: |
          # project.yml refers to Frameworks/SapBridge.xcframework, and
          # XcodeGen resolves that against the sources root, which is app/.
          # Unpack there, not into app/DLiPA.
          mkdir -p app/Frameworks app/build/ios
          tar -xzf app/DLiPA/Frameworks/sapbridge-ios.tar.gz -C app/Frameworks
          ls -laR app/Frameworks | head -20
          echo "==> unicorn archive"
          ls -la app/build/ios/ 2>/dev/null || echo "no archive in tarball"


      - name: Bundle the Apple SAP assets
        run: |
          # The four binaries are ~119 MB and stored with git-lfs.
          git lfs install
          git lfs pull
          ls -la VendorAssets
          ./scripts/stage-assets.sh "$GITHUB_WORKSPACE/VendorAssets" "$GITHUB_WORKSPACE/app/DLiPA/Resources/SapAssets"

      - name: Install xcodegen
        run: |
          # project.yml is the source of truth; xcodegen turns it into a real
          # .xcodeproj so there is no fragile hand-edited pbxproj.
          brew install xcodegen
          xcodegen --version

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build the app (unsigned)
        working-directory: app
        run: |
          # Generate the project from project.yml; there is no checked-in
          # pbxproj to go stale.
          xcodegen generate
          ls -la DLiPA.xcodeproj

          # No -sdk iphoneos: the macos-15 image ships the iOS 18 SDK without
          # the installed platform, and naming the SDK makes the asset and
          # storyboard steps probe for runtimes that are not present.
          #
          # No xcpretty either: it is not installed, and "|| true" would mask
          # a real build failure as success.
          set -o pipefail
          xcodebuild \
            -project DLiPA.xcodeproj \
            -scheme DLiPA \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Locate the built app
        id: app
        run: |
          APP=$(find app/build -name "DLiPA.app" -maxdepth 4 -type d | head -n 1)
          if [ -z "$APP" ]; then echo "::error::DLiPA.app not found"; exit 1; fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          du -sh "$APP"

      - name: Package as IPA
        run: |
          sh scripts/package-ipa.sh "${{ steps.app.outputs.path }}" DLiPA-unsigned.ipa
          ls -la DLiPA-unsigned.ipa

      - name: Report IPA contents
        run: |
          unzip -l DLiPA-unsigned.ipa | tail -n +2 | head -n 30
          echo "--- size ---"
          du -h DLiPA-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DLiPA-ipa
          path: DLiPA-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach IPA to a release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: app
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DLiPA-ipa
          path: dist

      - name: Checksum
        run: |
          cd dist
          sha256sum DLiPA-unsigned.ipa > DLiPA-unsigned.ipa.sha256
          cat DLiPA-unsigned.ipa.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DLiPA-unsigned.ipa
            dist/DLiPA-unsigned.ipa.sha256
          body: |
            ## DLiPA (SAP-adapted build)

            This build adds the App Store request signing that Apple now
            requires. Install it with your own Apple ID:

            * **AltStore** - open the IPA from the My Apps tab
            * **Sideloadly** - drag the IPA in and sign in

            Free Apple IDs get a 7-day certificate; re-sign weekly.
            A paid developer account lasts a year.

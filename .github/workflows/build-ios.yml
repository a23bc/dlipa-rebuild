name: Build iOS IPA

# Builds an UNSIGNED .app and packages it as an .ipa.
# No Apple Developer account is needed: the user signs the IPA on their own
# machine with AltStore / Sideloadly using their free Apple ID, exactly as the
# original DLiPA README instructs.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        required: false
        default: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-bridge:
    name: Build SAP bridge for iOS
    runs-on: macos-15
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install build tools
        run: |
          brew install ldid cmake pkg-config

      - name: Stage the Apple SAP assets
        run: |
          git lfs install
          git lfs pull
          sh scripts/stage-assets.sh "$GITHUB_WORKSPACE/VendorAssets" "$GITHUB_WORKSPACE/build/sap-assets"

      - name: Run Go unit tests
        working-directory: sapbridge
        env:
          # Lets the live handshake/kbsync tests run instead of skipping.
          DSH_SAP_ASSET_DIR: ${{ github.workspace }}/build/sap-assets
        run: |
          go test -count=1 ./...

      - name: Build Unicorn for iOS arm64
        run: |
          sh scripts/build-unicorn-ios.sh

      # gomobile is a host (macOS) tool. It must NOT see the iOS CGO_LDFLAGS,
      # or the linker rejects the Unicorn archive as the wrong platform.
      - name: Install gomobile
        # gomobile is a host tool. It must NOT inherit GOOS=ios, or go install
        # cross-compiles it and drops it in $GOPATH/bin/ios_arm64/gomobile.
        # It must also not see the iOS CGO_LDFLAGS, or the linker rejects the
        # Unicorn archive as the wrong platform.
        working-directory: sapbridge
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile version

      - name: Bind the bridge into an iOS framework
        working-directory: sapbridge
        env:
          CGO_ENABLED: "1"
          GOOS: ios
          GOARCH: arm64
          # Force-load the Unicorn archive and export its symbols so purego can
          # resolve them at runtime on iOS.
          CGO_LDFLAGS: -Wl,-force_load,${{ github.workspace }}/build/ios/libunicorn.a -Wl,-export_dynamic
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile bind -target=ios -o ../app/DLiPA/Frameworks/SapBridge.framework .
          echo "==> framework contents"
          ls -la ../app/DLiPA/Frameworks/SapBridge.framework

      - name: Verify the framework contains Unicorn
        run: |
          # A missing Unicorn backend only shows up as uc_open failing at
          # runtime, which is invisible until the app runs. Check here.
          FRAMEWORK=app/DLiPA/Frameworks/SapBridge.framework/SapBridge
          if nm -A "$FRAMEWORK" 2>/dev/null | grep -q uc_open; then
            echo "==> Unicorn symbols present"
          else
            echo "::error::uc_open not found; Unicorn is not linked into the framework"
            exit 1
          fi
          echo "==> exported uc_ symbols:"
          nm -A "$FRAMEWORK" 2>/dev/null | grep -c " T uc_" || true

      - name: Pack the framework for the app job
        id: pack
        run: |
          tar -czf sapbridge-ios.tar.gz -C app/DLiPA/Frameworks SapBridge.framework
          echo "artifact=sapbridge-ios.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sapbridge-ios
          path: sapbridge-ios.tar.gz
          retention-days: 5

  app:
    name: Build unsigned DLiPA app
    runs-on: macos-15
    needs: go-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Download the SAP bridge
        uses: actions/download-artifact@v4
        with:
          name: sapbridge-ios
          path: app/DLiPA/Frameworks

      - name: Unpack the framework
        run: |
          tar -xzf app/DLiPA/Frameworks/sapbridge-ios.tar.gz -C app/DLiPA/Frameworks
          ls -la app/DLiPA/Frameworks

      - name: Bundle the Apple SAP assets
        run: |
          # The four binaries are ~119 MB and stored with git-lfs.
          git lfs install
          git lfs pull
          ls -la VendorAssets
          ./scripts/stage-assets.sh "$GITHUB_WORKSPACE/VendorAssets" "$GITHUB_WORKSPACE/app/DLiPA/Resources/SapAssets"

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
          go version

      - name: Build the app (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project DLiPA.xcodeproj \
            -scheme DLiPA \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | xcpretty || true

      - name: Locate the built app
        id: app
        run: |
          APP=$(find app/build -name "DLiPA.app" -maxdepth 4 -type d | head -n 1)
          if [ -z "$APP" ]; then echo "::error::DLiPA.app not found"; exit 1; fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          du -sh "$APP"

      - name: Package as IPA
        run: |
          sh scripts/package-ipa.sh "${{ steps.app.outputs.path }}" DLiPA-unsigned.ipa
          ls -la DLiPA-unsigned.ipa

      - name: Report IPA contents
        run: |
          unzip -l DLiPA-unsigned.ipa | tail -n +2 | head -n 30
          echo "--- size ---"
          du -h DLiPA-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DLiPA-ipa
          path: DLiPA-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach IPA to a release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: app
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DLiPA-ipa
          path: dist

      - name: Checksum
        run: |
          cd dist
          sha256sum DLiPA-unsigned.ipa > DLiPA-unsigned.ipa.sha256
          cat DLiPA-unsigned.ipa.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DLiPA-unsigned.ipa
            dist/DLiPA-unsigned.ipa.sha256
          body: |
            ## DLiPA (SAP-adapted build)

            This build adds the App Store request signing that Apple now
            requires. Install it with your own Apple ID:

            * **AltStore** - open the IPA from the My Apps tab
            * **Sideloadly** - drag the IPA in and sign in

            Free Apple IDs get a 7-day certificate; re-sign weekly.
            A paid developer account lasts a year.
